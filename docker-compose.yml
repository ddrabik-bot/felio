services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - felio_net

  web:
    image: nginx:1.27-alpine
    ports:
      - "8086:80"
    volumes:
      - ./:/var/www/html:ro
      - ./.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - felio_net

  composer:
    image: composer:2
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - felio_net

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - felio_net

networks:
  felio_net:
    name: felio_felio_net
    driver: bridge
