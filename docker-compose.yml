name: ${FELIO_COMPOSE_PROJECT:-felio}

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:Uu9pib5bVJrdUQJZ8OMO7pPqL3HP/3l4FiZNsWkubHY=
      APP_URL: http://localhost:${FELIO_HTTP_PORT:-8086}
      SESSION_DRIVER: file
      CACHE_STORE: file
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: felio
      DB_USERNAME: felio
      DB_PASSWORD: felio
    depends_on:
      db:
        condition: service_healthy
    networks:
      - felio_net

  yfinance-web:
    build:
      context: ./spikes/yfinance-provider
      dockerfile: Dockerfile
    environment:
      PORT: 8000
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - felio_net

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    command: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:Uu9pib5bVJrdUQJZ8OMO7pPqL3HP/3l4FiZNsWkubHY=
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: felio
      DB_USERNAME: felio
      DB_PASSWORD: felio
    depends_on:
      db:
        condition: service_healthy
      yfinance-web:
        condition: service_healthy
    networks:
      - felio_net

  web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "${FELIO_HTTP_PORT:-8086}:80"
    depends_on:
      - app
    networks:
      - felio_net
      - cloudflare_tunnel

  composer:
    image: composer:2
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    networks:
      - felio_net

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - felio_net

  yfinance-spike:
    build:
      context: ./spikes/yfinance-provider
      dockerfile: Dockerfile
    working_dir: /app
    entrypoint: ["python", "probe.py"]
    networks:
      - felio_net

  nbp-fx-spike:
    build:
      context: ./spikes/nbp-fx-provider
      dockerfile: Dockerfile
    working_dir: /workspace/spikes/nbp-fx-provider
    profiles:
      - spike
    networks:
      - felio_net

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: felio
      POSTGRES_USER: felio
      POSTGRES_PASSWORD: felio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felio -d felio"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - felio_net

volumes:
  node_modules:
    name: ${FELIO_COMPOSE_PROJECT:-felio}_node_modules
  postgres_data:
    name: ${FELIO_COMPOSE_PROJECT:-felio}_postgres_data
  vendor:
    name: ${FELIO_COMPOSE_PROJECT:-felio}_vendor

networks:
  felio_net:
    name: ${FELIO_COMPOSE_PROJECT:-felio}_felio_net
    driver: bridge
  cloudflare_tunnel:
    external: true
    name: cloudflare_tunnel
