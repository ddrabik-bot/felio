name: felio

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: base64:Uu9pib5bVJrdUQJZ8OMO7pPqL3HP/3l4FiZNsWkubHY=
      APP_URL: http://localhost:8086
      SESSION_DRIVER: file
      CACHE_STORE: file
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: felio
      DB_USERNAME: felio
      DB_PASSWORD: felio
    depends_on:
      db:
        condition: service_healthy
    networks:
      - felio_net

  web:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "8086:80"
    depends_on:
      - app
    networks:
      - felio_net
      - cloudflare_tunnel

  composer:
    image: composer:2
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vendor:/var/www/html/vendor
    networks:
      - felio_net

  node:
    image: node:22-alpine
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - node_modules:/var/www/html/node_modules
    networks:
      - felio_net

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: felio
      POSTGRES_USER: felio
      POSTGRES_PASSWORD: felio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felio -d felio"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - felio_net

volumes:
  node_modules:
    name: felio_node_modules
  postgres_data:
    name: felio_postgres_data
  vendor:
    name: felio_vendor

networks:
  felio_net:
    name: felio_felio_net
    driver: bridge
  cloudflare_tunnel:
    external: true
    name: cloudflare_tunnel
