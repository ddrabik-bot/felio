name: ${FELIO_BACKUP_VERIFY_PROJECT:?Set a unique disposable verification project name}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: felio_backup_verify
      POSTGRES_USER: felio_verify
      POSTGRES_PASSWORD: felio_verify
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U felio_verify -d felio_backup_verify"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - verify_net

volumes:
  postgres_data:
    name: ${FELIO_BACKUP_VERIFY_PROJECT}_postgres_data

networks:
  verify_net:
    name: ${FELIO_BACKUP_VERIFY_PROJECT}_net
    driver: bridge
